[package]
name = "simplecrypt-gui"
version = "2.0.0"
edition = "2021"
description = "Cross-platform GUI for SimpleCrypt file encryption"

[dependencies]
simplecrypt-core = { path = "../simplecrypt-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "simplecrypt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package]
name = "simplecrypt-core"
version = "2.0.0"
edition = "2021"
description = "Core encryption library for SimpleCrypt - multi-algorithm file encryption"

[dependencies]
# Cryptography
openssl = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
toml = "0.8"

# Config
dirs = "6"

# Security
zeroize = { version = "1.7", features = ["derive"] }

# IO
tempfile = "3.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
legacy-openssl = []
